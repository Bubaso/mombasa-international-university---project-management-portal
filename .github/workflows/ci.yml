name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:smoke

      # Authorization is the one thing that must never regress silently: the
      # portal is open to external stakeholders, so these run on every change.
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib

      - name: Authorization policy tests
        run: npm run test:policies
